services:
  dam:
    build:
      context: .
      target: runtime
    image: dam-portal:gcp
    restart: unless-stopped
    env_file:
      - ${DAM_ENV_FILE:-.env.gcp}
    environment:
      NODE_ENV: production
      NITRO_PRESET: node-server
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_PATH: /var/lib/dam/database.sqlite
      DATABASE_MIGRATIONS_DIR: /app/server/database/migrations
      LOCAL_DAM_STORAGE_DIR: /var/lib/dam/files
      PYTHON_CMD: /opt/dam-python/bin/python
    ports:
      - "8080:8080"
    volumes:
      - dam_data:/var/lib/dam
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      replicas: 1

volumes:
  dam_data:
